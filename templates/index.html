<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>To-Do Listem</title>
</head>

<body>
    <h1>To-Do Listem</h1>
    <form action="/ekle" method="post">
        <input type="text" name="baslik" placeholder="Yeni görev ekle!" required>
        <button type="submit">Ekle</button>
    </form>
    {% if gorevler %}
    <ul>
        {% for gorev in gorevler %}
        <li>
            {% if gorev.tamamlandi %}
            <s>{{ gorev.baslik }}</s> ✅
            {% else %}
            {{ gorev.baslik }}
            {% endif %}

            <form action="/tamamla/{{ gorev.id }}" method="POST" style="display:inline;">
                <button type="submit">
                    {% if gorev.tamamlandi %}Geri Al{% else %}Tamamla{% endif %}
                </button>
            </form>
            
            <form action="/sil/{{ gorev.id }}" method="POST" style="display:inline;">
                <button type="submit">Sil</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>Henüz görev yok.</p>
    {% endif %}
</body>

</html>
