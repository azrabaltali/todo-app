<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do Listem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container" style="max-width: 700px; margin-top: 50px; margin-bottom: 50px;">

        <div class="card shadow">
            <div class="card-body p-4">

                <h1 class="card-title text-center mb-4">📝 To-Do Listem</h1>

                <form action="/ekle" method="POST" class="d-flex gap-2 mb-4">
                    <input type="text" name="baslik" class="form-control" placeholder="Yeni görev ekle..." required>
                    <button type="submit" class="btn btn-primary">Ekle</button>
                </form>

                {% if gorevler %}
                <ul class="list-group">
                    {% for gorev in gorevler %}
                    <li class="list-group-item d-flex justify-content-between align-items-center gap-2">
                        <div class="flex-grow-1">
                            {% if gorev.tamamlandi %}
                            <s class="text-secondary">{{ gorev.baslik }}</s>
                            <span class="ms-2">✅</span>
                            {% else %}
                            <span>{{ gorev.baslik }}</span>
                            {% endif %}
                        </div>

                        <div class="d-flex gap-1">
                            <form action="/tamamla/{{ gorev.id }}" method="POST">
                                <button type="submit"
                                    class="btn btn-sm {% if gorev.tamamlandi %}btn-outline-secondary{% else %}btn-success{% endif %}">
                                    {% if gorev.tamamlandi %}Geri Al{% else %}Tamamla{% endif %}
                                </button>
                            </form>

                            <form action="/sil/{{ gorev.id }}" method="POST">
                                <button type="submit" class="btn btn-sm btn-danger">Sil</button>
                            </form>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
                {% else %}
                <div class="text-center text-secondary py-4">
                    <p class="mb-0">Henüz görev yok.</p>
                    <small>Yukarıdaki kutudan ilk görevini ekle!</small>
                </div>
                {% endif %}

            </div>
        </div>

    </div>
</body>

</html>
